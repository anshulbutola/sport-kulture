[build]
publish = "."

[build.environment]
NODE_VERSION = "20"

[build.processing]
css = "tailwindcss"
html = "html-minifier"
js = "terser"
images = "imagemin"

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
from = "/podcast"
to = "#podcast"
status = 302

[[redirects]]
from = "/magazine"
to = "#magazine"
status = 302

[[redirects]]
from = "/contact"
to = "#contact"
status = 302
